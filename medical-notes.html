<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>昨日重现 · 医学手记</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1d1009;
      font-family: "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", serif;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .showcase {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: radial-gradient(circle at 50% 45%, #50311c, #170c07 75%);
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #2a180e;
      box-shadow: 0 18px 50px rgba(18, 8, 3, .58);
    }

    .medical-image {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    /* 返回按钮 */
    .btn-back {
      position: absolute; z-index: 20;
      left: 3%; top: 5%;
      padding: 10px 22px;
      border: 1px solid rgba(180, 140, 100, 0.4);
      color: #d4b896;
      background: rgba(30, 18, 10, 0.7);
      font-family: inherit;
      font-size: clamp(13px, 1.4vw, 18px);
      letter-spacing: 0.08em;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .btn-back:hover {
      background: rgba(50, 30, 15, 0.85);
    }

    /* 章节导航 */
    .chap-nav {
      position: absolute; z-index: 20;
      right: 3%; top: 5%;
      display: flex; gap: 6px;
    }
    .chap-nav button {
      padding: 8px 14px;
      border: 1px solid rgba(180, 140, 100, 0.3);
      color: #b09878;
      background: rgba(30, 18, 10, 0.6);
      font-family: inherit;
      font-size: clamp(11px, 1.1vw, 15px);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      border-radius: 4px;
      transition: all 0.25s;
    }
    .chap-nav button:hover,
    .chap-nav button.active {
      color: #f4ddb0;
      background: rgba(60, 35, 18, 0.8);
      border-color: rgba(200, 160, 110, 0.5);
    }
    .chap-nav button.locked {
      opacity: 0.35;
      pointer-events: none;
      cursor: default;
      color: #6b5744;
      background: rgba(30, 18, 10, 0.3);
      border-color: rgba(120, 90, 60, 0.15);
    }

    @media (orientation: portrait) {
      .showcase::after {
        content: "请横握手机";
        position: fixed; z-index: 100; inset: 0;
        display: grid; place-items: center;
        color: #f4ddb0;
        background: #25140b;
        font-size: 22px;
        letter-spacing: .12em;
      }
    }
  </style>
</head>
<body>
  <main class="showcase">
    <section class="stage" aria-label="医学手记">
      <img class="medical-image" id="medicalImg" src="" alt="医学手记" draggable="false">

      <button class="btn-back" id="btnBack">← 返回档案</button>

      <nav class="chap-nav" id="chapNav">
        <button data-ch="1">第一章</button>
        <button data-ch="2">第二章</button>
        <button data-ch="3">第三章</button>
        <button data-ch="4">第四章</button>
        <button data-ch="5">第五章</button>
        <button data-ch="6">第六章</button>
        <button data-ch="7">第七章</button>
        <button data-ch="8">第八章</button>
        <button data-ch="9">第九章</button>
        <button data-ch="10">第十章</button>
      </nav>
    </section>
  </main>

  <script>
    const img = document.getElementById('medicalImg');
    const nav = document.getElementById('chapNav');
    const btnBack = document.getElementById('btnBack');

    // 从 URL 参数读当前章节
    const params = new URLSearchParams(window.location.search);
    let currentCh = parseInt(params.get('chapter')) || 1;
    if (currentCh < 1) currentCh = 1;
    if (currentCh > 10) currentCh = 10;

    function showChapter(ch) {
      currentCh = ch;
      const padded = String(ch).padStart(2, '0');
      img.src = `./medical/medical_ch${padded}.png`;
      img.alt = `第${ch}章 · 医学手记`;

      // 更新导航高亮 + 未解锁/锁定态
      nav.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.ch) === ch);
        const btnCh = parseInt(btn.dataset.ch);
        if (btnCh > entryChapter) {
          btn.disabled = true;
          btn.classList.add('locked');
        }
      });
    }

    nav.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        showChapter(parseInt(btn.dataset.ch));
      });
    });

    // 进入时锁死初始章节，切换只在页内浏览，返回必须回初始章节
    const entryChapter = currentCh;

    btnBack.addEventListener('click', () => {
      window.location.assign(`./memory-report-artwork.html?chapter=chapter_${String(entryChapter).padStart(2, '0')}`);
    });

    // 初始加载
    showChapter(currentCh);
  </script>
</body>
</html>

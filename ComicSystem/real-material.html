<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>《昨日重现》真实漫画素材验证</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eadcc4;
      background: radial-gradient(circle at 50% 15%, #30261e, #0b0907 72%);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    main { width: min(1180px, 96vw); }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font: 500 clamp(20px, 3vw, 32px) KaiTi, serif; }
    p { margin: 5px 0 0; color: #af9d83; }
    #status { flex: none; color: #d8bd91; font-variant-numeric: tabular-nums; }
    #comic {
      width: 100%;
      border: 1px solid #6d5740;
      box-shadow: 0 22px 72px #000a;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 12px;
      color: #ad9a80;
      font-size: 14px;
    }
    button {
      border: 1px solid #8f7555;
      padding: 8px 16px;
      color: #eadcc4;
      background: #261e17;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>第三章 · 真实漫画素材验证</h1>
        <p>直接读取“漫画”目录中的完整原图，没有切成单独文件。</p>
      </div>
      <div id="status">准备中…</div>
    </header>
    <div id="comic"></div>
    <footer>
      <span>点击画面、按空格/回车，或调用 player.next() 逐格显示</span>
      <button id="reset" type="button">重新播放</button>
    </footer>
  </main>
  <script type="module">
    import { ComicPlayer } from './ComicPlayer.js';

    const status = document.querySelector('#status');
    const player = new ComicPlayer('#comic', {
      duration: 500,
      onPanelShown: ({ index }) => {
        status.textContent = `${index} / ${player.panelCount}`;
      },
      onComplete: () => {
        status.textContent = `${player.panelCount} / ${player.panelCount} · 播放完成`;
      },
    });

    await player.load('./comics/chapter03_scene01.json');
    status.textContent = `0 / ${player.panelCount} · 点击开始`;
    document.querySelector('#reset').addEventListener('click', (event) => {
      event.stopPropagation();
      player.reset();
      status.textContent = `0 / ${player.panelCount} · 点击开始`;
    });
    window.player = player;
  </script>
</body>
</html>

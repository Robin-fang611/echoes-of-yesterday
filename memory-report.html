<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>昨日重现 · 记忆恢复报告 · Phase 2</title>
  <link rel="stylesheet" href="./src/ui/typography/typography.css">
  <link rel="stylesheet" href="./src/ui/styles/memory_report.css">
  <link rel="stylesheet" href="./src/ui/styles/ui_materials.css">
  <link rel="stylesheet" href="./src/ui/styles/memory_restoration.css">
  <link rel="stylesheet" href="./src/styles/ui_motion.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #2A1B12;
    }
    #ui-root {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <main id="ui-root" aria-label="昨日重现UI测试容器"></main>

  <script type="module">
    import { createMemoryReportApp } from "./src/ui/MemoryReportApp.js";

    const chapterName =
      new URLSearchParams(window.location.search).get("chapter") === "chapter_test"
        ? "chapter_test"
        : "chapter_01";

    const { UIAssetManager } = await import("./src/ui/core/UIAssetManager.js");
    const uiAssets = new UIAssetManager();
    window.YesterdayUI = createMemoryReportApp({
      root: document.getElementById("ui-root"),
      assets: {
        memoryReportTemplate:
          await uiAssets.loadImageSource("memoryReportBackground"),
      },
    });
    await window.YesterdayUI.fontManager.loadFonts();

    await window.YesterdayUI.memoryReportScreen.loadChapterData(
      `./src/data/${chapterName}.json`,
    );

    const { initializeMemoryReportInteractions } =
      await import("./src/memory-report-phase4.js");
    initializeMemoryReportInteractions(window.YesterdayUI);

    const { initializeMemoryReportVisualSystem } =
      await import("./src/ui/phase5/MemoryReportVisualSystem.js");
    const { MemoryRestoreStateManager } =
      await import("./src/ui/state/MemoryRestoreStateManager.js");
    const restoreStateManager = new MemoryRestoreStateManager();
    const restoreData =
      window.YesterdayUI.memoryReportScreen.chapterData.memoryRestore;
    const chapterId =
      window.YesterdayUI.memoryReportScreen.chapterData.chapterId;
    const persistedRestoreState = restoreStateManager.read(chapterId);
    const initialProgress = persistedRestoreState?.completed
      ? persistedRestoreState.progress
      : restoreData?.from;
    window.YesterdayUI.visualSystem =
      await initializeMemoryReportVisualSystem(window.YesterdayUI, {
        initialProgress,
        restoreStateManager,
      });

    const autoplay =
      new URLSearchParams(window.location.search).get("autoplay") !== "0";
    const shouldAutoplay =
      restoreData && autoplay && !persistedRestoreState?.completed;
    if (restoreData && persistedRestoreState?.completed) {
      window.YesterdayUI.visualSystem.showMemoryRestoreFinalState({
        ...restoreData,
        to: persistedRestoreState.progress,
        items: persistedRestoreState.items,
      });
    } else if (shouldAutoplay) {
      window.YesterdayUI.visualSystem.prepareMemoryRestore(restoreData);
    }

    const reportElement =
      window.YesterdayUI.memoryReportScreen.element;
    await (document.fonts?.ready ?? Promise.resolve());
    await new Promise((resolve) => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
        reportElement.classList.add("font-ready");
        resolve();
        return;
      }
      const finishReveal = () => {
        window.clearTimeout(fallbackTimer);
        reportElement.removeEventListener("transitionend", onTransitionEnd);
        resolve();
      };
      const onTransitionEnd = (event) => {
        if (event.propertyName !== "opacity") return;
        finishReveal();
      };
      const fallbackTimer = window.setTimeout(finishReveal, 1000);
      reportElement.addEventListener("transitionend", onTransitionEnd);
      requestAnimationFrame(() => {
        reportElement.classList.add("font-ready");
      });
    });

    if (shouldAutoplay) {
      window.YesterdayUI.visualSystem.restoreMemorySequence(restoreData)
        .catch((error) => {
          console.error("[MemoryRestorationSequence]", error);
          window.YesterdayUI.visualSystem.showMemoryRestoreFinalState(
            restoreData,
          );
        });
    }
  </script>
</body>
</html>
